<title>Dragões Relâmpago</title>
<meta name="description" content="Jogo de navegador de uma sessão: crie, cruze, evolua e batalhe com dragões contra o relógio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: barra de recursos fixa no topo, abas logo abaixo, conteúdo em painéis de "pedra vulcânica" à noite. Tema único e escuro, por escolha. */
:root {
  --bg: #130f1f;
  --panel: #1e1832;
  --panel-2: #2a2245;
  --line: #3d3363;
  --fg: #f4effd;
  --muted: #a89ec7;
  --ember: #ff7a3d;
  --ember-2: #ffb35c;
  --gold: #ffcc4d;
  --food: #84e08a;
  --gem: #62e3ff;
  --good: #6ee7a0;
  --bad: #ff6b7a;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(1200px 600px at 80% -10%, #2b1a3d 0%, transparent 60%), var(--bg);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gem); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: .3px; margin: 0; text-wrap: balance; }
h2 { font-size: 1.25rem; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

/* Barra superior */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(19, 15, 31, .94); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; }
.brand { font-family: var(--font-display); font-size: 1.15rem; color: var(--ember-2); margin-right: auto; white-space: nowrap; }
.res { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; font-weight: 800; }
.res small { color: var(--muted); font-weight: 600; }
.res.gold b { color: var(--gold); } .res.food b { color: var(--food); } .res.gem b { color: var(--gem); }
.lvl { display: flex; flex-direction: column; gap: 3px; min-width: 120px; }
.lvl span { font-size: .8rem; font-weight: 800; }
.bar { height: 7px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember), var(--ember-2)); border-radius: inherit; transition: width .3s; }
.bar.green > i { background: linear-gradient(90deg, #3fbf6b, var(--food)); }
.bar.blue > i { background: linear-gradient(90deg, #2f8fd6, var(--gem)); }
.bar.gold > i { background: linear-gradient(90deg, #d69a1f, var(--gold)); }
.bar.hp > i { background: linear-gradient(90deg, #36c46f, #9cf07b); }
.bar.hp.low > i { background: linear-gradient(90deg, #d93a3a, #ff8a5c); }
.timer { font-family: var(--font-display); font-size: 1.2rem; padding: 2px 10px; border-radius: 10px; background: var(--panel-2); }
.timer.hurry { color: var(--bad); animation: pulse 1s infinite; }
.iconbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font-weight: 700; }
.buffs { display: flex; gap: 6px; flex-wrap: wrap; }
.buff { font-size: .8rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #3a2a10; color: var(--gold); border: 1px solid #6b4d16; }

/* Abas */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin; }
.tab { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; color: var(--muted); position: relative; }
.tab[aria-selected="true"] { background: var(--ember); border-color: var(--ember); color: #1b0e05; }
.tab .badge { position: absolute; top: -6px; right: -4px; background: var(--gem); color: #04242c; font-size: .7rem; border-radius: 999px; padding: 0 6px; }

/* Ilha isométrica + painéis */
body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.stage { position: relative; }
.mapwrap { overflow: auto; background: #1d5f8f; scrollbar-width: thin; overscroll-behavior: contain; }
.mapwrap svg.iso { display: block; width: 100%; height: auto; max-height: calc(100vh - 150px); margin-inline: auto; }
.iso .bld { cursor: pointer; }
.iso .bld:hover .lot, .iso .bld:focus .lot { filter: brightness(1.15); }
.iso .bld:focus { outline: none; }
.iso .bld:focus-visible .lot { stroke: #62e3ff; stroke-width: 3; }
.iso text { font-family: var(--font-body); font-weight: 800; pointer-events: none; }
.iso .lbl { font-size: 12px; fill: #fff; }
.iso .pill { fill: rgba(19, 15, 31, .8); }
.iso .bubble { animation: hover 1.4s ease-in-out infinite; }
.iso .bubble.full { animation: pulsebub .8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.iso .roam { animation: roam 7s ease-in-out infinite alternate; }
.iso .wave { animation: wavex 4s ease-in-out infinite alternate; }
.iso .cloud { animation: cloud 60s linear infinite; }
.iso .cloud.c2 { animation-duration: 85s; animation-delay: -40s; }
.iso .cloud.c3 { animation-duration: 70s; animation-delay: -20s; }
.iso .heart { transform-box: fill-box; transform-origin: center; animation: beat 1.2s ease-in-out infinite; }
.iso .flag { transform-box: fill-box; transform-origin: 0 50%; animation: flagw 1.4s ease-in-out infinite alternate; }
.iso .smoke { animation: wisp 3s ease-in-out infinite; }
.iso .glow { animation: pulse 1.6s ease-in-out infinite; }
.iso .foam { animation: foam 6s linear infinite; }
@keyframes foam { to { stroke-dashoffset: -48; } }
.iso .ready-crop { animation: hover 1s ease-in-out infinite; }
.iso .ghost { opacity: .55; }
.iso .ghost:hover { opacity: .9; }
@keyframes pulsebub { 50% { transform: scale(1.18); } }
@keyframes roam { from { transform: translateX(-7px); } to { transform: translateX(7px); } }
@keyframes wavex { to { transform: translateX(14px); opacity: .25; } }
@keyframes cloud { from { transform: translateX(-300px); } to { transform: translateX(1300px); } }
@keyframes beat { 50% { transform: scale(1.25); } }
@keyframes flagw { to { transform: skewY(8deg) scaleX(.85); } }
.hud { position: absolute; top: 10px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud .box { background: rgba(19, 15, 31, .86); border: 1px solid var(--line); border-radius: 14px; padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; backdrop-filter: blur(4px); }
.hud .crop { padding: 3px 8px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; gap: 4px; overflow-x: auto;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(19, 15, 31, .96); border-top: 1px solid var(--line); }
.dock .tab { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px; border: 1px solid transparent; border-radius: 14px; padding: 5px 10px; background: transparent; color: var(--muted); font-weight: 800; font-size: .72rem; position: relative; }
.dock .tab .ic { font-size: 22px; line-height: 1.1; }
.dock .tab[aria-selected="true"] { background: var(--ember); color: #1b0e05; }
.dock .tab .badge { position: absolute; top: -2px; right: 2px; background: var(--gem); color: #04242c; font-size: .7rem; border-radius: 999px; padding: 0 6px; }
.sheet-back { position: fixed; inset: 0; z-index: 30; background: rgba(8, 6, 14, .55); }
.sheet { position: fixed; z-index: 31; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  width: min(1100px, calc(100% - 24px)); background: var(--bg); border: 1px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: sheetin .22s ease-out; }
.sheet > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.sheet > header h2 { font-size: 1.35rem; }
.sheet-body { overflow-y: auto; padding: 14px 16px 20px; }
@keyframes sheetin { from { opacity: 0; transform: translate(-50%, 16px); } }
@media (max-width: 700px) {
  .mapwrap svg.iso { width: 920px; max-width: none; max-height: none; }
  .sheet { top: auto; height: 82%; width: 100%; border-radius: 20px 20px 0 0; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  .dock { justify-content: flex-start; }
  .hud { top: 8px; left: 8px; right: 8px; }
  .hud-lbl { display: none; }
  .top .wrap > .iconbtn[data-a="askEnd"] { padding: 5px 8px; }
}
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-weight: 800; }
.btn:hover:not(:disabled) { border-color: var(--ember-2); }
.btn.primary { background: linear-gradient(180deg, var(--ember-2), var(--ember)); border-color: transparent; color: #241005; }
.btn.gemb { background: #0f3440; border-color: #1f6577; color: var(--gem); }
.btn.small { padding: 4px 9px; font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.cost { font-weight: 800; }
.cost.g { color: var(--gold); } .cost.f { color: var(--food); } .cost.m { color: var(--gem); }
.btn.primary .cost { color: inherit; }
.hint { font-size: .85rem; color: var(--muted); }

/* Ícone de dragão */
.dic { position: relative; display: inline-block; flex: none; }
.dic .els { position: absolute; bottom: -2px; right: -4px; font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 3px; line-height: 1.4; }
.dic.s { width: 42px; height: 36px; }
.dic.m { width: 66px; height: 56px; }
.dic.l { width: 160px; height: 134px; }
.dic.xl { width: 220px; height: 184px; }
.dic.l .els, .dic.xl .els { display: none; }
.dic.unknown .dg { filter: brightness(0); opacity: .35; }
.dic.unknown .els { display: none; }
.dic.flip .dg { transform: scaleX(-1); }
.dic.pop { animation: popin .6s cubic-bezier(.2, 1.6, .4, 1); }
.dg { display: block; width: 100%; height: 100%; overflow: visible; }
.dg .shadow { fill: rgba(0, 0, 0, .35); transform-box: fill-box; transform-origin: center; animation: shadowp 2.4s ease-in-out infinite; animation-delay: var(--dl); }
.dg .base { transform-box: fill-box; transform-origin: center; }
.dg .all { animation: hover 2.4s ease-in-out infinite; animation-delay: var(--dl); }
.dg .wing { transform-origin: 50px 50px; animation: flap .8s ease-in-out infinite; animation-delay: var(--dl); }
.dg .wing-b { animation-delay: calc(var(--dl) - .12s); }
.dg .tail { transform-origin: 38px 62px; animation: sway 2s ease-in-out infinite; animation-delay: var(--dl); }
.dg .head { transform-origin: 74px 58px; animation: nod 2.4s ease-in-out infinite; animation-delay: var(--dl); }
.dg .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; animation-delay: var(--dl); }
.dg .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .3s ease-in-out infinite alternate; }
.dg .zap { animation: zap 1.1s steps(1) infinite; }
.dg .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 1.6s ease-in-out infinite; }
.dg .spark:nth-of-type(2n) { animation-delay: -.8s; }
.dg .wisp { animation: wisp 3s ease-in-out infinite; }
.dg .aura { transform-box: fill-box; transform-origin: center; animation: aura 2.2s ease-in-out infinite; }
.dg .halo { animation: hover 2s ease-in-out infinite; }
.dg .drip { animation: drip 1.8s ease-in infinite; }
.proj { position: fixed; z-index: 65; pointer-events: none; font-size: 30px; filter: drop-shadow(0 0 10px rgba(255, 255, 255, .7)); }
@keyframes hover { 50% { transform: translateY(-3px); } }
@keyframes shadowp { 50% { transform: scaleX(.88); opacity: .7; } }
@keyframes flap { 50% { transform: rotate(-16deg) scaleY(.8); } }
@keyframes sway { 50% { transform: rotate(8deg); } }
@keyframes nod { 50% { transform: rotate(-4deg); } }
@keyframes blink { 0%, 91%, 97%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
@keyframes flick { to { transform: scale(1.12, .86); } }
@keyframes zap { 50% { opacity: .25; } }
@keyframes twinkle { 50% { transform: scale(.3) rotate(45deg); opacity: .3; } }
@keyframes wisp { 50% { transform: translateY(-5px); opacity: .25; } }
@keyframes aura { 50% { transform: scale(1.08); opacity: .08; } }
@keyframes drip { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
@keyframes popin { from { transform: scale(.2) rotate(-12deg); opacity: 0; } }
.rar-C { color: #c9c3dc; } .rar-R { color: #64bcff; } .rar-E { color: #d39bff; } .rar-L { color: #ffc23d; }

/* Ilha */
.habs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.hab { background: linear-gradient(180deg, #2c2450, #221b3d); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; transition: transform .1s; min-height: 118px; }
.hab:hover { border-color: var(--gold); }
.hab:active { transform: scale(.97); }
.hab.full { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 204, 77, .25); }
.hab .drs { display: flex; gap: 4px; min-height: 36px; }
.hab .slot { width: 36px; height: 36px; border-radius: 50%; border: 2px dashed var(--line); margin-inline: 3px; }
.hab .st { font-weight: 800; color: var(--gold); display: flex; justify-content: space-between; font-size: .9rem; }
.farms { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.farm { background: #2a2116; border: 1px solid #4d3b22; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 96px; justify-content: center; font-weight: 700; font-size: .85rem; }
.farm .big { font-size: 28px; line-height: 1; }
.farm.ready { border-color: var(--food); box-shadow: 0 0 0 2px rgba(132, 224, 138, .25); animation: bob 1.2s ease-in-out infinite; }
.farm .bar { width: 100%; }
.crops { display: flex; gap: 6px; flex-wrap: wrap; }
.crop { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 4px 8px; font-weight: 700; font-size: .85rem; }
.crop[aria-pressed="true"] { border-color: var(--food); background: #1d3a22; }
.eggs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.egg { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; font-size: .85rem; }
.egg .shell { font-size: 34px; line-height: 1; }
.egg.ready .shell { animation: wobble .8s ease-in-out infinite; }
.egg.empty { border-style: dashed; color: var(--muted); justify-content: center; min-height: 110px; }

/* Dragões */
.dlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.dcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; gap: 12px; align-items: center; min-width: 0; }
.dcard .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.dcard .name { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcard .meta { font-size: .8rem; color: var(--muted); }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.dex .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: .72rem; font-weight: 700; padding: 8px 4px; border-radius: 10px; background: var(--panel-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 700; font-size: .85rem; }
.chip[aria-pressed="true"] { border-color: var(--ember-2); background: #3d2614; }
.chip:disabled { opacity: .4; cursor: not-allowed; }

/* Cruzamento */
.breedbox { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.parent { background: var(--panel-2); border: 2px dashed var(--line); border-radius: 14px; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; text-align: center; font-weight: 700; }
.parent.set { border-style: solid; border-color: var(--ember); }
.heart { font-size: 30px; }
.outcomes { display: flex; flex-direction: column; gap: 6px; }
.outcome { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.outcome .pct { margin-left: auto; font-weight: 800; }

/* Arena */
.ladder { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.rung { text-align: center; font-size: .68rem; font-weight: 800; padding: 6px 2px; border-radius: 8px; background: var(--panel-2); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.rung.done { background: #1e3b2a; color: var(--good); }
.rung.cur { background: var(--ember); color: #241005; }
.battle { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side { background: var(--panel-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.side .fname { font-weight: 800; }
.side .bar { width: 100%; height: 12px; }
.bench { display: flex; gap: 6px; }
.bench .ko { filter: grayscale(1) brightness(.5); }
.log { background: #0e0b18; border-radius: 12px; padding: 10px 12px; font-size: .85rem; max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.log .se { color: var(--good); } .log .ne { color: var(--muted); } .log .cr { color: var(--gold); } .log .ko { color: var(--bad); }
.result { text-align: center; padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.result h2 { font-size: 2rem; }

/* Missões e conquistas */
.missions { display: flex; flex-direction: column; gap: 10px; }
.mission { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.mission .ic { font-size: 26px; }
.mission.done { border-color: var(--good); }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 12px; padding: 10px; border: 1px solid var(--line); }
.ach .ic { font-size: 24px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: #0e0b18; flex: none; }
.ach.locked { opacity: .5; }
.ach.locked .ic { filter: grayscale(1); }
.ach b { display: block; font-size: .9rem; }
.ach small { color: var(--muted); font-size: .78rem; display: block; }
.cat { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; }

/* Estatísticas */
.stats { width: 100%; border-collapse: collapse; font-size: .9rem; }
.stats td { padding: 5px 0; border-bottom: 1px solid var(--line); }
.stats td:last-child { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: 220px; display: block; }
.elbars { display: flex; flex-direction: column; gap: 6px; }
.elbar { display: grid; grid-template-columns: 90px 1fr 30px; gap: 8px; align-items: center; font-size: .85rem; font-weight: 700; }
.elbar .bar { height: 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; }
.kpi b { display: block; font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; }
.kpi span { font-size: .78rem; color: var(--muted); font-weight: 700; }

/* Loja */
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.item { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.item.locked { opacity: .5; }
.item .t { font-weight: 800; }

/* Sobreposições */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 7, 18, .88); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px; max-width: 760px; width: 100%; display: flex; flex-direction: column; gap: 16px; }

.toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--ember); border-radius: 12px; padding: 10px 14px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: slide .25s ease-out; max-width: 340px; }

<script>
/* AUDIO-START: cópia de audio/audio.js (sons e música sintetizados). Para atualizar, substitua o conteúdo até AUDIO-END. */
/* =====================================================================
   Dragões Relâmpago — Sons e Música
   ---------------------------------------------------------------------
   Tudo é sintetizado no navegador com a Web Audio API: nenhum arquivo
   de áudio, nenhuma dependência. Expõe um único objeto global `Som`.

   Uso rápido:
     Som.play('coletar');                       // efeito sonoro
     Som.play('ataque', { elemento: 'fogo' });  // efeito com opções
     Som.musica('ilha');                        // troca a música (crossfade)
     Som.musica(null);                          // para a música
     Som.tensao(0.6);                           // 0..1, deixa a música da ilha tensa
     Som.alternarMudo();  Som.volume(0.8);
     Som.criarControles(elemento);              // botão de mudo + volumes

   O áudio só começa depois do primeiro clique ou tecla (regra dos
   navegadores). Pedidos de música feitos antes disso ficam guardados
   e começam sozinhos no primeiro gesto. Nada é salvo em localStorage.
   ===================================================================== */
(function () {
  'use strict';

  const AC = window.AudioContext || window.webkitAudioContext;

  // ------------------------------------------------------------------
  // Estado
  // ------------------------------------------------------------------
  const st = {
    mudo: false,
    volume: 0.8,      // geral
    volMusica: 0.5,
    volEfeitos: 0.85,
    faixa: null,      // faixa pedida (mesmo antes do desbloqueio)
    tensao: 0,
    pausadoPeloJogo: false,
  };
  const ouvintes = [];
  let ctx = null, master, busMusica, busEfeitos, reverb, revSend, ruido;
  let ultimoTocado = {};

  const m2f = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const escolha = (arr) => arr[(Math.random() * arr.length) | 0];

  function avisar() { const e = estado(); ouvintes.forEach((fn) => { try { fn(e); } catch (_) {} }); }
  function estado() {
    return { mudo: st.mudo, volume: st.volume, volMusica: st.volMusica, volEfeitos: st.volEfeitos,
      faixa: st.faixa, tensao: st.tensao, ativo: !!(ctx && ctx.state === 'running'), suportado: !!AC };
  }

  // ------------------------------------------------------------------
  // Grafo de áudio
  // ------------------------------------------------------------------
  function iniciarContexto() {
    if (ctx || !AC) return ctx;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4;
    comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ctx.createGain();
    master.connect(comp); comp.connect(ctx.destination);
    busMusica = ctx.createGain(); busMusica.connect(master);
    busEfeitos = ctx.createGain(); busEfeitos.connect(master);

    // reverb gerado (ruído com decaimento exponencial)
    reverb = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 2.2);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    reverb.buffer = ir;
    revSend = ctx.createGain(); revSend.gain.value = 0.35;
    revSend.connect(reverb); reverb.connect(master);

    // ruído branco reaproveitado
    ruido = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = ruido.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    aplicarVolumes(true);
    return ctx;
  }

  function aplicarVolumes(imediato) {
    if (!ctx) return;
    const t = ctx.currentTime, tc = imediato ? 0.001 : 0.08;
    master.gain.setTargetAtTime(st.mudo ? 0 : st.volume, t, tc);
    busMusica.gain.setTargetAtTime(st.volMusica, t, tc);
    busEfeitos.gain.setTargetAtTime(st.volEfeitos, t, tc);
  }

  function desbloquear() {
    if (!AC) return;
    iniciarContexto();
    if (ctx.state === 'suspended' && !st.pausadoPeloJogo) ctx.resume().then(() => { iniciarMusicaSePreciso(); avisar(); });
    else iniciarMusicaSePreciso();
  }
  ['pointerdown', 'keydown', 'touchend'].forEach((ev) =>
    window.addEventListener(ev, desbloquear, { capture: true, passive: true }));

  // O jogo pausa quando a aba fica oculta; o áudio acompanha.
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend();
    else if (!st.pausadoPeloJogo) ctx.resume();
  });

  // ------------------------------------------------------------------
  // Blocos de síntese. `at` é tempo absoluto do contexto.
  // ------------------------------------------------------------------
  function saida(dest, pan, rev) {
    let n = dest;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(dest); n = p; }
    return { no: n, rev };
  }

  function envelope(g, at, a, dur, vol, curva) {
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + a);
    if (curva === 'sustenta') { g.gain.setValueAtTime(vol, at + Math.max(a, dur - 0.08)); g.gain.linearRampToValueAtTime(0.0001, at + dur); }
    else g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  }

  // Oscilador com envelope, glissando e filtro opcionais.
  function tom(o) {
    const at = o.at, dur = o.dur || 0.2;
    const osc = ctx.createOscillator();
    osc.type = o.tipo || 'sine';
    osc.frequency.setValueAtTime(Math.min(o.f, 16000), at);
    if (o.f2) {
      if (o.lin) osc.frequency.linearRampToValueAtTime(o.f2, at + (o.glide || dur));
      else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), at + (o.glide || dur));
    }
    if (o.detune) osc.detune.value = o.detune;
    let ult = osc;
    if (o.filtro) {
      const fl = ctx.createBiquadFilter();
      fl.type = o.filtro; fl.frequency.setValueAtTime(o.ff || 1200, at); fl.Q.value = o.q || 0.7;
      if (o.ff2) fl.frequency.exponentialRampToValueAtTime(o.ff2, at + dur);
      osc.connect(fl); ult = fl;
    }
    const g = ctx.createGain();
    envelope(g, at, o.a || 0.005, dur, o.vol || 0.2, o.curva);
    ult.connect(g);
    const s = saida(o.dest || busEfeitos, o.pan, o.rev);
    g.connect(s.no);
    if (o.rev) { const rg = ctx.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(revSend); }
    if (o.vib) { // vibrato
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1];
      l.connect(lg); lg.connect(osc.frequency); l.start(at); l.stop(at + dur + 0.05);
    }
    osc.start(at); osc.stop(at + dur + 0.05);
    return osc;
  }

  // Ruído filtrado com envelope.
  function chiado(o) {
    const at = o.at, dur = o.dur || 0.2;
    const src = ctx.createBufferSource();
    src.buffer = ruido; src.loop = true;
    const fl = ctx.createBiquadFilter();
    fl.type = o.filtro || 'bandpass'; fl.Q.value = o.q || 1;
    fl.frequency.setValueAtTime(o.ff || 1500, at);
    if (o.ff2) fl.frequency.exponentialRampToValueAtTime(o.ff2, at + (o.glide || dur));
    const g = ctx.createGain();
    envelope(g, at, o.a || 0.003, dur, o.vol || 0.2, o.curva);
    src.connect(fl); fl.connect(g);
    const s = saida(o.dest || busEfeitos, o.pan);
    g.connect(s.no);
    if (o.rev) { const rg = ctx.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(revSend); }
    if (o.trem) { // tremolo (para tremores)
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = o.trem[0]; lg.gain.value = o.trem[1];
      l.connect(lg); lg.connect(g.gain); l.start(at); l.stop(at + dur + 0.05);
    }
    src.start(at, Math.random() * 1.5); src.stop(at + dur + 0.05);
  }

  // Sino: parciais inarmônicas.
  function sino(f, at, dur, vol, dest, rev) {
    tom({ at, f, dur, vol, dest, rev, tipo: 'sine' });
    if (f * 2.76 < 16000) tom({ at, f: f * 2.76, dur: dur * 0.5, vol: vol * 0.35, dest, rev });
    if (f * 5.4 < 16000) tom({ at, f: f * 5.4, dur: dur * 0.25, vol: vol * 0.15, dest, rev });
  }
  function moeda(at, f, vol, pan) {
    tom({ at, f, dur: 0.07, vol, tipo: 'square', filtro: 'lowpass', ff: 5000, pan });
    tom({ at: at + 0.06, f: f * 1.335, dur: 0.22, vol: vol * 0.9, tipo: 'square', filtro: 'lowpass', ff: 5000, pan, rev: 0.15 });
  }
  function brilho(at, n, vol, base) {
    for (let i = 0; i < n; i++) sino((base || 2000) * rnd(0.9, 2), at + i * rnd(0.02, 0.06), 0.25, vol * rnd(0.4, 1), busEfeitos, 0.4);
  }
  function arpejo(notas, at, passo, o) {
    notas.forEach((m, i) => tom(Object.assign({ at: at + i * passo, f: m2f(m) }, o)));
  }

  // Rugido: serra com formantes + ruído + distorção.
  let curvaDist = null;
  function distorcao() {
    if (curvaDist) return curvaDist;
    const n = 1024; curvaDist = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curvaDist[i] = (3 + 20) * x * 0.3 / (Math.PI + 20 * Math.abs(x)); }
    return curvaDist;
  }
  function rugido(at, dur, grave, vol) {
    const ws = ctx.createWaveShaper(); ws.curve = distorcao();
    const g = ctx.createGain(); envelope(g, at, 0.12, dur, vol);
    const f1 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 600 * grave + 100; f1.Q.value = 2;
    const f2 = ctx.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1400 * grave + 200; f2.Q.value = 3;
    const mix = ctx.createGain(); mix.gain.value = 1;
    ws.connect(f1); ws.connect(f2); f1.connect(mix); f2.connect(mix); mix.connect(g);
    g.connect(busEfeitos);
    const rg = ctx.createGain(); rg.gain.value = 0.5; g.connect(rg); rg.connect(revSend);
    const base = 70 * grave + 30;
    [0, 7, -5].forEach((dt, i) => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.detune.value = dt * 3;
      o.frequency.setValueAtTime(base, at);
      o.frequency.linearRampToValueAtTime(base * 1.6, at + dur * 0.3);
      o.frequency.linearRampToValueAtTime(base * 0.75, at + dur);
      const lf = ctx.createOscillator(), lg = ctx.createGain();
      lf.frequency.value = 23 + i * 4; lg.gain.value = base * 0.25;
      lf.connect(lg); lg.connect(o.frequency);
      o.connect(ws); o.start(at); o.stop(at + dur + 0.05); lf.start(at); lf.stop(at + dur + 0.05);
    });
    chiado({ at, dur, ff: 900 * grave + 300, q: 0.8, vol: vol * 0.6, a: 0.1 });
  }

  // ------------------------------------------------------------------
  // Efeitos sonoros. Cada um recebe (t = agora, o = opções).
  // ------------------------------------------------------------------
  const ATAQUES = {
    fogo(t, k) {
      chiado({ at: t, dur: 0.45 * k, ff: 300, ff2: 2500, glide: 0.18, q: 0.9, vol: 0.45 * k, a: 0.04 });
      chiado({ at: t + 0.15, dur: 0.4 * k, filtro: 'lowpass', ff: 900, ff2: 200, vol: 0.3 * k });
      tom({ at: t, f: 90, f2: 50, dur: 0.4, vol: 0.25 * k });
    },
    agua(t, k) {
      for (let i = 0; i < 6 * k; i++) { const f = rnd(300, 800); tom({ at: t + i * 0.045, f, f2: f * 2.2, dur: 0.08, vol: 0.18, tipo: 'sine' }); }
      chiado({ at: t + 0.2, dur: 0.35 * k, filtro: 'lowpass', ff: 3000, ff2: 400, vol: 0.3 * k, rev: 0.3 });
    },
    planta(t, k) {
      chiado({ at: t, dur: 0.18, filtro: 'highpass', ff: 1500, ff2: 6000, vol: 0.3 * k, a: 0.06 });
      [0, 0.09, 0.16].forEach((d, i) => tom({ at: t + 0.12 + d, f: 260 + i * 70, f2: 180, dur: 0.12, vol: 0.25 * k, tipo: 'triangle' }));
      chiado({ at: t + 0.12, dur: 0.3, ff: 4000, q: 2, vol: 0.12 * k });
    },
    terra(t, k) {
      tom({ at: t, f: 130, f2: 35, dur: 0.5 * k, vol: 0.6 * Math.min(k, 1.3), tipo: 'sine' });
      chiado({ at: t, dur: 0.4 * k, filtro: 'lowpass', ff: 500, ff2: 120, vol: 0.5 * k });
      for (let i = 0; i < 4; i++) chiado({ at: t + 0.08 + i * 0.05, dur: 0.05, ff: rnd(800, 2000), q: 3, vol: 0.12 });
    },
    eletrico(t, k) {
      const o = tom({ at: t, f: 900, f2: 300, dur: 0.3 * k, vol: 0.16 * k, tipo: 'sawtooth', filtro: 'highpass', ff: 600 });
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.type = 'square'; l.frequency.value = 55; lg.gain.value = 500;
      l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + 0.35 * k);
      chiado({ at: t, dur: 0.25 * k, filtro: 'highpass', ff: 3000, vol: 0.2 * k, trem: [40, 0.15] });
      tom({ at: t + 0.02, f: 2400, f2: 1200, dur: 0.1, vol: 0.1, tipo: 'square' });
    },
    gelo(t, k) {
      for (let i = 0; i < 7 * k; i++) sino(rnd(1800, 4200), t + i * 0.035, 0.3, 0.09, busEfeitos, 0.5);
      chiado({ at: t, dur: 0.5 * k, filtro: 'highpass', ff: 5000, ff2: 9000, vol: 0.18 * k, a: 0.05 });
      tom({ at: t, f: 1200, f2: 2400, dur: 0.25, vol: 0.06, tipo: 'triangle' });
    },
    metal(t, k) {
      [520, 1310, 2030, 3150].forEach((f, i) => tom({ at: t, f: f * rnd(0.98, 1.02), dur: 0.6 * k / (i * 0.4 + 1), vol: 0.2 / (i + 1) * k, tipo: i ? 'sine' : 'triangle', rev: 0.3 }));
      chiado({ at: t, dur: 0.06, ff: 3000, q: 1, vol: 0.4 * k });
      tom({ at: t, f: 160, f2: 70, dur: 0.15, vol: 0.3 });
    },
    trevas(t, k) {
      chiado({ at: t, dur: 0.6 * k, ff: 200, ff2: 900, glide: 0.5 * k, q: 3, vol: 0.35 * k, a: 0.35 * k, curva: 'sustenta' });
      tom({ at: t, f: 95, f2: 45, dur: 0.7 * k, vol: 0.3 * k, tipo: 'sawtooth', filtro: 'lowpass', ff: 500, a: 0.2 });
      tom({ at: t, f: 101, f2: 47, dur: 0.7 * k, vol: 0.25 * k, tipo: 'sawtooth', filtro: 'lowpass', ff: 500, a: 0.2, rev: 0.4 });
    },
    luz(t, k) {
      arpejo([84, 88, 91, 95, 96], t, 0.035, { dur: 0.5, vol: 0.12 * k, tipo: 'sine', rev: 0.6 });
      chiado({ at: t, dur: 0.4 * k, filtro: 'highpass', ff: 3000, ff2: 8000, vol: 0.15 * k, a: 0.1 });
      tom({ at: t, f: 600, f2: 2400, dur: 0.3, vol: 0.08, tipo: 'triangle' });
    },
    neutro(t, k) {
      chiado({ at: t, dur: 0.25 * k, ff: 600, ff2: 2000, q: 1, vol: 0.3 * k, a: 0.05 });
      tom({ at: t + 0.1, f: 160, f2: 60, dur: 0.2, vol: 0.35 * k });
    },
  };
  const elem = (o) => ATAQUES[normalizar(o && o.elemento)] || ATAQUES.neutro;
  function normalizar(e) {
    if (!e) return 'neutro';
    e = String(e).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const mapa = { fire: 'fogo', water: 'agua', plant: 'planta', earth: 'terra', electric: 'eletrico', ice: 'gelo', dark: 'trevas', light: 'luz' };
    return mapa[e] || e;
  }

  const RAR = { comum: 0, raro: 1, epico: 2, lendario: 3 };
  const rar = (o) => RAR[normalizar(o && o.raridade)] ?? 0;

  const SONS = {
    // --- interface ---
    clique(t) { tom({ at: t, f: 900, f2: 620, dur: 0.05, vol: 0.12, tipo: 'triangle' }); },
    aba(t) { tom({ at: t, f: 660, dur: 0.04, vol: 0.08, tipo: 'sine' }); tom({ at: t + 0.03, f: 990, dur: 0.05, vol: 0.06 }); },
    erro(t) { tom({ at: t, f: 190, dur: 0.1, vol: 0.14, tipo: 'square', filtro: 'lowpass', ff: 1200 }); tom({ at: t + 0.12, f: 140, dur: 0.16, vol: 0.14, tipo: 'square', filtro: 'lowpass', ff: 1000 }); },
    pausar(t) { arpejo([76, 69, 64], t, 0.07, { dur: 0.12, vol: 0.12, tipo: 'triangle' }); },
    retomar(t) { arpejo([64, 69, 76], t, 0.07, { dur: 0.12, vol: 0.12, tipo: 'triangle' }); },
    confirmar(t) { arpejo([72, 79], t, 0.06, { dur: 0.15, vol: 0.12, tipo: 'triangle' }); },

    // --- economia ---
    coletar(t, o) {
      const n = Math.max(1, Math.min(5, (o && o.quantidade) || 1));
      for (let i = 0; i < n; i++) moeda(t + i * 0.05, 988 * Math.pow(1.06, i) * rnd(0.98, 1.03), 0.12 / Math.sqrt(n), rnd(-0.4, 0.4));
    },
    coletarTudo(t) {
      for (let i = 0; i < 8; i++) moeda(t + i * 0.055, m2f(76 + [0, 2, 4, 7, 9, 12, 14, 16][i]), 0.07, rnd(-0.6, 0.6));
      brilho(t + 0.45, 4, 0.08, 2500);
    },

  // Espaçamento mínimo entre repetições do mesmo som (ms), para cliques em rajada.

    iniciarContexto();
    if (ctx.state !== 'running') return false;
    const agora = performance.now(), min = INTERVALO[nome] || 0;
    if (min && ultimoTocado[nome] && agora - ultimoTocado[nome] < min) return false;
    ultimoTocado[nome] = agora;

      ],

        if (p % 2 === 0) I.baixo(m2f(p % 4 === 0 ? r : r + 12), at, sem * 1.6, 0.11, out, 900);
        if (c >= 8) I.pluck(m2f(notas[[0, 1, 2, 1][p % 4]] + 12), at, sem, 0.035, out);
        if (p % 2 === 0) { const m = this.melodia[ac][p / 2]; if (m) I.lead(m2f(m), at, sem * 1.8, c >= 8 ? 0.045 : 0.055, out); }
        if (p === 0 || p === 8 || p === 10) I.bumbo(at, 0.32, out);
        if (p === 4 || p === 12) I.caixa(at, 0.16, out);
        if (p % 2 === 0) I.chimbal(at, 0.035, out, p % 4 === 2);
        if (c % 4 === 3 && p >= 12) I.caixa(at, 0.08 + (p - 12) * 0.02, out);
      },
    },

    // Invasão Final: sombria e pesada, Ré menor com toque frígio.
    invasao: {
      bpm: 84, compassos: 16,
      acordes: [[50, 53, 57], [46, 50, 53], [43, 46, 50], [45, 49, 52], [50, 53, 57], [51, 55, 58], [48, 52, 55], [45, 49, 52]],
      raiz: [38, 34, 31, 33, 38, 39, 36, 33],
      trompa: [[62, _, 65, 64], [62, _, _, _], [67, _, 65, 62], [61, _, 64, _], [69, _, 70, 69], [67, _, 63, _], [64, 65, 67, 64], [61, _, _, _]],
      passo(s, at, out, sem) {
        const c = Math.floor(s / 16) % this.compassos, p = s % 16, ac = c % 8;
        const notas = this.acordes[ac], r = this.raiz[ac];
        if (p === 0) {
          I.pad(notas.map((m) => m + 12), at, sem * 16, 0.014, out, 1000);
          tom({ at, f: m2f(r), dur: sem * 16, vol: 0.08, tipo: 'sawtooth', filtro: 'lowpass', ff: 260, q: 3, dest: out, curva: 'sustenta', a: 0.2 });

        if (p === 3 || p === 6 || p === 11) I.taiko(at, 0.22, out);

        if (p % 4 === 0) { const m = this.trompa[ac][p / 4]; if (m) I.trompa(m2f(c >= 8 ? m + 12 : m), at, sem * (this.trompa[ac][p / 4 + 1] === _ ? 7.5 : 3.8), 0.05, out); }
        if (c >= 8) { // ostinato de cordas na segunda metade
          const ost = [notas[0] + 24, notas[2] + 12, notas[1] + 12, notas[2] + 12];
          tom({ at, f: m2f(ost[p % 4]), dur: sem * 0.9, vol: 0.022, tipo: 'sawtooth', filtro: 'lowpass', ff: 2000, dest: out });
        }
        if (p % 4 === 2) I.chimbal(at, 0.02, out);
      },
    },

    placar: {
      bpm: 88, compassos: 8,
      acordes: [[53, 57, 60, 64], [57, 60, 64, 67], [58, 62, 65, 69], [60, 64, 67, 70]],
      raiz: [41, 45, 46, 48],
      passo(s, at, out, sem) {
        const c = Math.floor(s / 16) % this.compassos, p = s % 16, ac = c % 4;

    trocarFaixa(quer);
  }

  function trocarFaixa(nome) {
    const t = ctx.currentTime;
    if (mus.atual) { // fade-out da anterior; as notas já agendadas terminam nesse ganho
      const velha = mus.atual;
      velha.ganho.gain.cancelScheduledValues(t);
      velha.ganho.gain.setValueAtTime(velha.ganho.gain.value, t);
      velha.ganho.gain.linearRampToValueAtTime(0, t + 1.2);
      setTimeout(() => velha.ganho.disconnect(), 1800);
      mus.atual = null;
    }
    if (!nome || !FAIXAS[nome]) { pararTimer(); return; }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 1.0);
    g.connect(busMusica);
    mus.atual = { nome, faixa: FAIXAS[nome], ganho: g, passo: 0, prox: t + 0.1 };
    if (!mus.timer) mus.timer = setInterval(agendar, 25);
  }
  function pararTimer() { if (mus.timer) { clearInterval(mus.timer); mus.timer = null; } }

  function agendar() {
    const a = mus.atual;
    if (!a || !ctx || ctx.state !== 'running') return;
    const sem = 60 / a.faixa.bpm / 4;
    // se o relógio pulou (aba voltou), não tenta recuperar notas perdidas
    if (a.prox < ctx.currentTime - 0.2) a.prox = ctx.currentTime + 0.05;
    while (a.prox < ctx.currentTime + 0.15) {
      try { a.faixa.passo(a.passo, a.prox, a.ganho, sem); } catch (e) { console.warn('[Som] música', e); }
      a.prox += sem; a.passo++;
    }
  }

  function musica(nome) {
    if (nome && !FAIXAS[nome]) { console.warn('[Som] faixa desconhecida:', nome); return; }

    if (ctx && ctx.state === 'running') trocarFaixa(st.faixa);
    avisar();
  }

  // ------------------------------------------------------------------
  let cssInjetado = false;
  function injetarCss() {

    const s = document.createElement('style');

.som-ctrl{display:inline-flex;align-items:center;gap:8px;font:13px/1.2 system-ui,sans-serif;color:inherit}
.som-ctrl button{all:unset;cursor:pointer;font-size:18px;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:rgba(127,127,127,.18)}

.som-ctrl button:focus-visible{outline:2px solid currentColor}
.som-ctrl label{display:inline-flex;align-items:center;gap:4px;opacity:.9}
.som-ctrl input[type=range]{width:80px;accent-color:#f5a623}
.som-ctrl.som-compacto label{display:none}
.som-ctrl.som-compacto:hover label,.som-ctrl.som-compacto:focus-within label{display:inline-flex}`;
    document.head.appendChild(s);
  }

  function criarControles(alvo, opcoes) {
    injetarCss();
    const el = document.createElement('div');
    el.className = 'som-ctrl' + (opcoes && opcoes.compacto ? ' som-compacto' : '');
    el.innerHTML = `<button type="button" data-som="mudo" aria-label="Som ligado"></button>
<label title="Música">🎵<input type="range" min="0" max="100" data-som="musica" aria-label="Volume da música"></label>
<label title="Efeitos">💥<input type="range" min="0" max="100" data-som="efeitos" aria-label="Volume dos efeitos"></label>`;
    const b = el.querySelector('[data-som=mudo]'), rm = el.querySelector('[data-som=musica]'), re = el.querySelector('[data-som=efeitos]');
    const sync = (e) => {
      b.textContent = e.mudo ? '🔇' : '🔊';
      b.setAttribute('aria-label', e.mudo ? 'Som desligado (clique para ligar)' : 'Som ligado (clique para desligar)');
      b.title = (e.mudo ? 'Ligar som' : 'Desligar som') + ' (M)';
      if (document.activeElement !== rm) rm.value = Math.round(e.volMusica * 100);
      if (document.activeElement !== re) re.value = Math.round(e.volEfeitos * 100);
    };
    // pointerdown não deve propagar para o ouvinte global do jogo
    ['pointerdown', 'pointerup', 'click'].forEach((ev) => el.addEventListener(ev, (e) => e.stopPropagation()));
    b.addEventListener('click', () => alternarMudo());
    rm.addEventListener('input', () => volumeMusica(rm.value / 100));
    re.addEventListener('input', () => volumeEfeitos(re.value / 100));
    re.addEventListener('change', () => play('clique'));
    aoMudar(sync); sync(estado());
    if (alvo) alvo.appendChild(el);
    return el;
  }

  // ------------------------------------------------------------------
  // API pública
  // ------------------------------------------------------------------
  function mudo(v) { st.mudo = !!v; aplicarVolumes(); avisar(); }
  function alternarMudo() { mudo(!st.mudo); if (!st.mudo) desbloquear(); return st.mudo; }
  const lim = (v) => Math.max(0, Math.min(1, +v || 0));
  function volume(v) { if (v === undefined) return st.volume; st.volume = lim(v); aplicarVolumes(); avisar(); }
  function volumeMusica(v) { if (v === undefined) return st.volMusica; st.volMusica = lim(v); aplicarVolumes(); avisar(); }
  function volumeEfeitos(v) { if (v === undefined) return st.volEfeitos; st.volEfeitos = lim(v); aplicarVolumes(); avisar(); }
  function tensao(v) { if (v === undefined) return st.tensao; st.tensao = lim(v); avisar(); }
  function pausar() { st.pausadoPeloJogo = true; if (ctx) ctx.suspend(); }
  function retomar() { st.pausadoPeloJogo = false; if (ctx && !document.hidden) ctx.resume().then(iniciarMusicaSePreciso); }
  function aoMudar(fn) { ouvintes.push(fn); return () => { const i = ouvintes.indexOf(fn); if (i >= 0) ouvintes.splice(i, 1); }; }
  function ligarTeclaM() {
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) alternarMudo();
    });
  }

  window.Som = {
    play, musica, tensao, pausar, retomar,
    mudo, alternarMudo, volume, volumeMusica, volumeEfeitos,
    estado, aoMudar, criarControles, ligarTeclaM, desbloquear,
    efeitos: Object.keys(SONS), faixas: Object.keys(FAIXAS),
    elementos: Object.keys(ATAQUES),
  };
})();

function speciesFromEls(els) {
  const s = [...new Set(els)].sort((a, b) => EL_KEYS.indexOf(a) - EL_KEYS.indexOf(b));
  if (s.length === 1) {
    const e = s[0];
    return { key: e, name: EL[e].pn, els: s, rar: SPECIAL_EL.includes(e) ? 'R' : 'C' };
  }
  const rar = s.some(e => SPECIAL_EL.includes(e)) ? 'E' : 'R';
  return { key: s.join('+'), name: EL[s[0]].pre + EL[s[1]].suf, els: s, rar };
}
function speciesFromLegend(L) { return { key: 'L:' + L.k, name: L.n, els: L.els.slice(), rar: 'L' }; }
function allSpecies() {
  const out = [];
  EL_KEYS.forEach(e => out.push(speciesFromEls([e])));
  for (let i = 0; i < EL_KEYS.length; i++) for (let j = i + 1; j < EL_KEYS.length; j++) out.push(speciesFromEls([EL_KEYS[i], EL_KEYS[j]]));
  LEGENDS.forEach(L => out.push(speciesFromLegend(L)));
  return out;
}

function eff(atkEl, defEls) {
  if (!atkEl || !defEls || !defEls.length) return 1;

}

function breedOutcomes(a, b) {
  const pool = new Set([...a.els, ...b.els]);
  const res = [];
  let remaining = 1;
  for (const L of LEGENDS) {
    if (L.els.every(e => pool.has(e))) { res.push({ sp: speciesFromLegend(L), p: remaining * L.ch }); remaining *= 1 - L.ch; }
  }
  const combos = [];
  a.els.forEach(x => b.els.forEach(y => combos.push(speciesFromEls([x, y]))));
  const per = remaining / combos.length;
  combos.forEach(sp => {
    const ex = res.find(r => r.sp.key === sp.key);
    if (ex) ex.p += per; else res.push({ sp, p: per });
  });
  return res.sort((x, y) => y.p - x.p);
}
function rollBreed(a, b) {
  const out = breedOutcomes(a, b);
  let r = Math.random();
  for (const o of out) { if ((r -= o.p) <= 0) return o.sp; }
  return out[out.length - 1].sp;
}
function layEgg(sp, free = false) {
  if (!free) sfx('ovoColocado');
  S.eggs.push({ id: S.nextId++, sp, prog: 0, dur: RARITY[sp.rar].egg, free });
}
function breed() {

  S.eggs.forEach(e => {

  });
  S.stats.peakGps = Math.max(S.stats.peakGps, totalGps());
  if (S.t - S.history[S.history.length - 1].t >= 5) {
    S.history.push({ t: S.t, earned: S.stats.goldEarned, gps: totalGps() });
    if (S.history.length > 800) S.history.splice(1, 1);
  }
  if (S.t >= S.nextEvent) triggerEvent();

function drawChart() {
  const cv = document.getElementById('chart');
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const pts = S.history.concat([{ t: S.t, earned: S.stats.goldEarned, gps: totalGps() }]);
  const pad = { l: 52, r: 52, t: 12, b: 26 };
  const W = w - pad.l - pad.r, H = h - pad.t - pad.b;
  const tMax = Math.max(60, S.t), eMax = Math.max(100, ...pts.map(p => p.earned)), gMax = Math.max(5, ...pts.map(p => p.gps));
  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue('--line').trim(), muted = css.getPropertyValue('--muted').trim();
  g.font = '11px Nunito, sans-serif'; g.fillStyle = muted; g.strokeStyle = line; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + H - (H * i / 4);
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(pad.l + W, y); g.stroke();
    g.textAlign = 'right'; g.fillText(fmt(eMax * i / 4), pad.l - 6, y + 4);
    g.textAlign = 'left'; g.fillText(fmt(gMax * i / 4) + '/s', pad.l + W + 6, y + 4);
  }
  g.textAlign = 'center';
  for (let i = 0; i <= 4; i++) g.fillText(fmtTime(tMax * i / 4), pad.l + W * i / 4, h - 6);
  const X = t => pad.l + W * t / tMax;
  g.beginPath(); pts.forEach((p, i) => { const x = X(p.t), y = pad.t + H - H * p.earned / eMax; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.lineTo(X(pts[pts.length - 1].t), pad.t + H); g.lineTo(X(0), pad.t + H); g.closePath();
  g.fillStyle = 'rgba(255,122,61,.15)'; g.fill();
  g.beginPath(); pts.forEach((p, i) => { const x = X(p.t), y = pad.t + H - H * p.earned / eMax; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = '#ff7a3d'; g.lineWidth = 2.5; g.stroke();
  g.beginPath(); pts.forEach((p, i) => { const x = X(p.t), y = pad.t + H - H * p.gps / gMax; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = '#62e3ff'; g.setLineDash([5, 4]); g.lineWidth = 2; g.stroke(); g.setLineDash([]);
  const lp = pts[pts.length - 1];
  g.fillStyle = '#ff7a3d'; g.beginPath(); g.arc(X(lp.t), pad.t + H - H * lp.earned / eMax, 4, 0, Math.PI * 2); g.fill();
}

    <div class="achs">${got.length ? got.map(a => `<div class="ach"><span class="ic">${a.i}</span><div><b>${a.n}</b><small>${fmtTime(S.ach[a.id])}</small></div></div>`).join('') : '<span class="hint">Nenhuma desta vez.</span>'}</div>
    <details><summary style="cursor:pointer;font-weight:800">Todas as estatísticas</summary>
      ${statRows().map(([g, rows]) => `<h3 style="margin-top:12px">${g}</h3><table class="stats">${rows.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>`).join('')}
    </details>
    <div class="row" style="justify-content:center"><button class="btn primary" data-a="again">Jogar de novo</button></div>
  </div>`);
}

// ============================================================
// ENTRADA (pointerdown para não perder cliques durante a re-renderização)
// ============================================================
const ACTIONS = {
  tab: el => { S.tab = el.dataset.k; },
  collect: (el, ev) => collect(+el.dataset.i, ev),
  collectAll: (el, ev) => collectAll(ev),
  farm: (el, ev) => harvest(+el.dataset.i, ev),
  selCrop: el => { if (unlockedCrop(el.dataset.k)) S.selCrop = el.dataset.k; },
  harvestAll: () => harvestAll(),
  buyHab: () => buyHabitat(), buyFarm: () => buyFarm(), buyHatch: () => buyHatch(),
  buy: el => buyDragon(el.dataset.k),
  feed: el => feed(+el.dataset.id), sell: el => sell(+el.dataset.id),
  hatch: el => hatch(+el.dataset.id), speed: el => speedEgg(+el.dataset.id),
  pickParent: el => {
    const id = +el.dataset.id;
    if (S.breedA === id) S.breedA = null; else if (S.breedB === id) S.breedB = null;
    else if (!S.breedA) S.breedA = id; else S.breedB = id;
  },
  clearParent: el => { if (el.dataset.k === 'A') S.breedA = null; else S.breedB = null; },
  breed: () => breed(),
  team: el => toggleTeam(+el.dataset.id),
  fight: el => startBattle(el.dataset.k),
  move: el => playerMove(el.dataset.k),
  auto: () => { S.autoBattle = !S.autoBattle; },
  surrender: () => surrender(), closeBattle: () => closeBattle(),
  claim: el => claimMission(+el.dataset.i),
  merchant: () => buyMerchant(), gemGold: () => gemsToGold(), mystery: () => mysteryEgg(),
  egg: () => catchEgg(),
  pause: () => togglePause(),
  askEnd: () => overlay(`<div class="card hero"><h1>Encerrar a partida?</h1><p>${S && S.finalPhase ? 'Desistir agora conta como ilha não defendida.' : 'Você sai antes do Ancestral despertar, e a ilha fica sem defesa.'} Não dá para voltar.</p><div class="row"><button class="btn primary" data-a="end">Encerrar agora</button><button class="btn" data-a="cancelEnd">Continuar jogando</button></div></div>`),
  cancelEnd: () => overlay(''),
  end: () => endGame(),
  start: el => startGame(el.dataset.k),
  again: () => { S = null; $('#toasts').innerHTML = ''; renderStart(); ['#top', '#tabs', '#sheet', '#map', '#hud'].forEach(q => $(q).innerHTML = ''); lastTop = lastTabs = lastView = lastMap = lastHud = ''; mapCentered = false; },
};
function handle(ev) {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.a];
  if (!fn) return;
  if (S && !S.ended) S.stats.clicks++;
  const a = el.dataset.a;
  if (a === 'tab') sfx('aba');
  else if (['pause', 'askEnd', 'cancelEnd', 'pickParent', 'clearParent', 'team', 'selCrop', 'auto', 'start', 'again', 'surrender', 'end', 'move', 'fight'].includes(a)) { if (a !== 'pause' && a !== 'move' && a !== 'fight') sfx('clique'); }
  fn(el, ev);
  if (S && !S.ended) { checkAchievements(); render(); }
  runFx();
}
// Mouse age no pointerdown; toque age no pointerup, só se o dedo não arrastou (para não disparar ao rolar a tela)
let downAt = null;
document.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'mouse') { if (ev.button === 0) handle(ev); }
  else downAt = { x: ev.clientX, y: ev.clientY };
});
document.addEventListener('pointerup', ev => {
  if (ev.pointerType === 'mouse' || !downAt) return;
  const moved = Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y);
  downAt = null;
  if (moved < 12) {
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    if (target) handle({ target, clientX: ev.clientX, clientY: ev.clientY });
  }
});
document.addEventListener('click', ev => { if (ev.detail === 0) handle(ev); }); // teclado (Enter/Espaço)
document.addEventListener('keydown', ev => {
  if (!S || S.ended || ev.target.matches('input, textarea')) return;
  const n = parseInt(ev.key, 10);
  if (n >= 1 && n <= TABS.length) { S.tab = TABS[n - 1][0]; sfx('aba'); render(); }
  if (ev.key === 'p' || ev.key === 'P') togglePause();
  if (ev.key === 'Escape' && S.tab !== 'ilha') { S.tab = 'ilha'; render(); }
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('g[data-a]')) handle({ target: ev.target, clientX: 0, clientY: 0 });
  if ((ev.key === 'c' || ev.key === 'C') && S.level >= 5) { collectAll(); render(); }
});

// Atualizações ao vivo do artefato: preserva a partida em andamento
window.claude?.hot?.snapshot?.(() => ({ S: S ? JSON.parse(JSON.stringify(S)) : null }));
function boot(data) {
  try { Som.criarControles($('#somctl'), { compacto: true }); Som.ligarTeclaM(); } catch (e) { /* áudio é opcional */ }
  if (data && data.S && MODES[data.S.mode] && data.S.warned) { S = data.S; last = performance.now(); if (S.ended) { renderEnd(); music('placar'); } else { render(true); music(S.finalPhase ? 'invasao' : S.battle && !S.battle.over ? 'batalha' : 'ilha'); } }
  else renderStart();
  setInterval(tick, 250);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
// Gancho para testes automatizados
window.__game = { get S() { return S; }, startGame, tick, ACTIONS, endGame, ALL_SPECIES };
</script>
